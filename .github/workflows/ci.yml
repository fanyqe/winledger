name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WinLedger.sln

      - name: Build
        run: dotnet build WinLedger.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test WinLedger.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - name: Coverage gate
        shell: pwsh
        run: .\build\Check-Coverage.ps1 -CoveragePath artifacts\coverage -MinimumLineRate 0.50 -MinimumBranchRate 0.40

      - name: Format check
        run: dotnet format WinLedger.sln --verify-no-changes --no-restore

      - name: Vulnerable package check
        run: dotnet list WinLedger.sln package --vulnerable --include-transitive

      - name: Package portable release
        shell: pwsh
        run: .\build\Package-Portable.ps1 -Configuration Release -Runtime win-x64 -Version "0.1.0-ci-${{ github.run_number }}"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: winledger-portable-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: winledger-coverage
          path: artifacts/coverage/**/*.xml
